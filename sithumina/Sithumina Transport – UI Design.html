<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sithumina Transport – UI Design</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC20E;--y2:#FFE08A;--y3:#FFF6D6;--ink:#26231B;--mut:#6F6A5A;--bg:#F4F2EA;--card:#fff;--line:#E7E2D0;--ok:#1E9E5A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1A14;--card:#27241B;--ink:#F6F1DF;--mut:#B2AB92;--line:#3B3727;--y3:#352E12}}
:root[data-theme="dark"]{--bg:#1C1A14;--card:#27241B;--ink:#F6F1DF;--mut:#B2AB92;--line:#3B3727;--y3:#352E12}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:24px 16px 48px}
h1{font-size:20px;font-weight:800;margin-bottom:4px}
.note{color:var(--mut);font-size:13px;margin-bottom:20px}
.tag{font-size:13px;font-weight:700;margin:22px 0 10px;color:var(--mut)}
.scroll{overflow-x:auto;padding-bottom:8px}
.desk{width:1080px;height:660px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.top{height:72px;display:grid;grid-template-columns:240px 1fr auto;align-items:center;background:var(--y);color:#26231B;padding:0 20px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800}
.mark{width:36px;height:36px;border-radius:10px;background:#26231B;color:var(--y);display:grid;place-items:center;font-size:18px}
.brand{text-align:center;font-weight:800;font-size:20px;letter-spacing:.2px}.nums{display:flex;justify-content:center;gap:18px;font-size:12.5px;font-weight:700;margin-top:4px}.nums span{display:flex;align-items:center;gap:6px}.nums svg{width:15px;height:15px}.login{border:0;background:#26231B;color:var(--y);font:inherit;font-size:13px;font-weight:700;padding:9px 18px;border-radius:10px;cursor:pointer}
.right{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:700}
.right .ph{display:flex;flex-direction:column;line-height:1.3;text-align:right;font-size:12px}.ph span{display:flex;align-items:center;justify-content:flex-end;gap:5px}.wa{width:14px;height:14px;border-radius:50%;background:#1E9E5A;display:inline-grid;place-items:center}.wa svg{width:9px;height:9px;fill:#fff}.login{border:0;background:#26231B;color:var(--y);font:inherit;font-size:13px;font-weight:800;padding:10px 18px;border-radius:10px;cursor:pointer}
.lang{display:flex;background:rgba(38,35,27,.12);border-radius:999px;padding:3px}
.lang button{border:0;background:none;font:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;color:#26231B}
.lang button.on{background:#26231B;color:var(--y)}
.body{display:grid;grid-template-columns:240px 1fr;flex:1;min-height:0}
.side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.side a,.drawer a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}
.side a:hover,.drawer a:hover{background:var(--y3)}
.side a.act,.drawer a.act{background:var(--y);color:#26231B}
.side svg,.drawer svg{width:18px;height:18px;flex:none}
.soc{margin-top:auto;display:flex;gap:8px;padding:10px 12px}
.soc span{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800}
.main{padding:18px 22px;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.banner{position:relative;height:190px;border-radius:16px;overflow:hidden;flex:none}
.slide{position:absolute;inset:0;padding:24px 28px;display:flex;flex-direction:column;justify-content:center;opacity:0;transition:opacity .6s;color:#26231B}
.slide.on{opacity:1}
.slide b{font-size:26px;line-height:1.15;max-width:420px;font-weight:800}
.slide span{margin-top:8px;font-size:14px;max-width:380px}
.slide .tr{position:absolute;right:28px;bottom:14px;font-size:70px;opacity:.9}
.dots{position:absolute;left:28px;bottom:12px;display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(38,35,27,.3);cursor:pointer}
.dots i.on{width:22px;border-radius:6px;background:#26231B}
.cta{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.cta p{color:var(--mut);font-size:14px;line-height:1.55;max-width:520px}
.btns{display:flex;gap:10px}
.btn{border:0;font:inherit;font-weight:700;font-size:14px;padding:13px 18px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.p{background:var(--y);color:#26231B}.s{background:var(--card);color:var(--ink);border:2px solid var(--y)}
.mapcard{flex:1;min-height:0;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:1fr 240px;overflow:hidden;background:var(--y3)}
.mapw{position:relative;display:grid;place-items:center;min-height:0}
.mapw svg{height:100%;max-height:100%}
.live{position:absolute;left:12px;top:12px;background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pu 1.6s infinite}
@keyframes pu{50%{box-shadow:0 0 0 6px rgba(30,158,90,.2)}}
@media (prefers-reduced-motion:reduce){.live i,.pulse{animation:none}.slide{transition:none}}
.gps{position:absolute;right:12px;top:12px;background:var(--y);border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;color:#26231B}
.list{background:var(--card);border-left:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.list h4{font-size:13px}
.lr{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px}
.lr b{display:block;font-size:13px}
.st{font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px}
.go{background:#DDF3E7;color:#12663A}.em{background:var(--y2);color:#5B4300}
.pin{fill:#26231B;stroke:var(--y);stroke-width:3}
.pulse{fill:var(--y);opacity:.5;animation:pu2 2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu2{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
/* phone */
.phones{display:flex;gap:28px;flex-wrap:wrap}
.phone{width:360px;height:700px;background:var(--card);border:8px solid #26231B;border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.mtop{height:58px;background:var(--y);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#26231B;font-weight:800;flex:none}
.mtop .logo{font-size:15px}
.mtop .mark{width:30px;height:30px;font-size:15px;border-radius:8px}
.mtop button{border:0;background:rgba(38,35,27,.12);border-radius:10px;width:36px;height:36px;font-weight:800;cursor:pointer;color:#26231B;font-size:12px}
.mbody{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow:hidden}
.mbody .banner{height:150px}
.mbody .slide{padding:16px}.mbody .slide b{font-size:19px}.mbody .slide span{font-size:12px}.mbody .slide .tr{font-size:48px;right:14px}.mbody .dots{left:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:var(--y3);border:1px solid var(--y2);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700}
.mbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn .btn{padding:9px 6px;font-size:12px;border-radius:10px;white-space:nowrap}.mbtn .btn.s{border-width:1.5px}
.mbody .mapw{flex:1;border:1px solid var(--line);border-radius:14px;background:var(--y3);overflow:hidden}
.tabbar{height:58px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);flex:none;background:var(--card)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--mut);gap:2px}
.tabbar a.act{color:var(--ink)}.tabbar a.act::before{content:"";width:28px;height:4px;border-radius:2px;background:var(--y);margin-bottom:2px}
.drawer{position:absolute;inset:0;background:var(--card);transform:translateX(100%);transition:transform .25s;padding:14px;display:flex;flex-direction:column;gap:2px;z-index:5}
.drawer.open{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800}
.drawer header button{border:0;background:var(--y);border-radius:10px;width:36px;height:36px;font-weight:800;cursor:pointer}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.spec{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.sw{display:flex;align-items:center;gap:6px}.sw i{width:18px;height:18px;border-radius:5px;border:1px solid var(--line)}
.mpara{font-size:15px;font-weight:700;text-align:center}
</style>
</head>
<body>
<h1>Sithumina Transport – UI design</h1>
<p class="note">Desktop view සහ mobile view. Nav එකේ item එකක් click කරලා, slideshow එක, language switch එක සහ mobile menu එක try කරන්න.</p>

<div class="tag">Desktop view</div>
<div class="scroll"><div class="desk" id="desk"></div></div>

<div class="tag">Mobile view</div>
<div class="phones"><div class="phone" id="ph"></div></div>

<div class="spec">
 <span class="sw"><i style="background:#FFC20E"></i>Primary #FFC20E</span>
 <span class="sw"><i style="background:#FFE08A"></i>Soft #FFE08A</span>
 <span class="sw"><i style="background:#FFF6D6"></i>Tint #FFF6D6</span>
 <span class="sw"><i style="background:#26231B"></i>Ink #26231B</span>
 <span class="sw"><i style="background:#1E9E5A"></i>Live #1E9E5A</span>
 <span>Font: Plus Jakarta Sans</span>
</div>

<script>
const ic={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
find:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',
book:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
reg:'<path d="M1 7h13v10H1zM14 10h5l3 3v4h-8"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
qa:'<path d="M4 4h16v12H8l-4 4z"/>',
call:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
rev:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const T={
en:{nav:['Home','About us','Find empty lorry','Book individual vehicle','Register vehicle','Q&A','Contact details','Reviews'],
 desc:'Track every Sithumina lorry live on the map of Sri Lanka. Find an empty lorry near you or book a vehicle just for your load.',
 login:'Login',para:'Track lorries live, island-wide',chips:['📍 Live tracking','🚚 Empty lorries','📦 Book a vehicle'],b1:'Find empty lorry',b2:'Book individual vehicle',live:'Live · 24 lorries on the road',gps:'My location',list:'Nearby lorries',em:'Empty',go:'On trip',
 s:[['Lorries you can see, live','Follow your load from pickup to delivery.'],['Empty lorry nearby?','Find one on the map in seconds.'],['Own a lorry?','Register your vehicle and get more trips.']]},
si:{nav:['මුල් පිටුව','අපි ගැන','හිස් ලොරි සොයන්න','තනි වාහන වෙන්කිරීම','වාහනය ලියාපදිංචිය','ප්‍රශ්න සහ පිළිතුරු','අමතන්න','සමාලෝචන'],
 desc:'සිතුමිණ ලොරි සියල්ල ශ්‍රී ලංකා සිතියමේ සජීවීව බලන්න. ඔබ ළඟ ඇති හිස් ලොරියක් සොයන්න, නැත්නම් ඔබේ බඩු සඳහාම වාහනයක් වෙන් කරන්න.',
 login:'ඇතුල් වන්න',para:'දිවයින පුරා ලොරි සජීවීව බලන්න',chips:['📍 සජීවී ලුහුබැඳීම','🚚 හිස් ලොරි','📦 වාහන වෙන්කිරීම'],b1:'හිස් ලොරි සොයන්න',b2:'තනි වාහන වෙන්කිරීම',live:'සජීවී · ලොරි 24ක් ධාවනයේ',gps:'මගේ ස්ථානය',list:'ළඟම ලොරි',em:'හිස්',go:'ගමනේ',
 s:[['ලොරි සජීවීව බලන්න','ඔබේ බඩු ගමන ආරම්භයේ සිට අවසානය දක්වා.'],['ළඟ හිස් ලොරියක්ද?','සිතියමෙන් තත්පර කීපයකින් සොයන්න.'],['ලොරියක් තිබේද?','ලියාපදිංචි වී වැඩි ගමන් ලබාගන්න.']]}};
const keys=['home','about','find','book','reg','qa','call','rev'];
const bg=['#FFC20E','#FFD54A','#FFE08A'],em=['🚚','📍','🚛'];
let L='en',act=0,sl=0;
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>`;
const map=`<svg viewBox="0 0 200 300" aria-label="Sri Lanka live map"><path d="M96 8l16 6 6 18-4 14 8 18-2 22 12 18 6 20 18 28 2 26-14 28-22 28-22 14-24-2-18-30-8-34 2-30-10-22 8-26 6-24 10-14 4-20z" fill="#FFC20E" stroke="#26231B" stroke-width="3" stroke-linejoin="round"/>
${[[104,36],[96,102],[128,160],[88,222],[70,170]].map(([x,y],i)=>`<circle class="pulse" cx="${x}" cy="${y}" r="9" style="animation-delay:${i*.4}s"/><circle class="pin" cx="${x}" cy="${y}" r="6"/>`).join('')}
<text x="104" y="24" font-size="9" font-weight="700" text-anchor="middle" fill="#26231B" stroke="none">Jaffna</text><text x="76" y="244" font-size="9" font-weight="700" fill="#26231B">Galle</text><text x="48" y="166" font-size="9" font-weight="700" fill="#26231B">Colombo</text></svg>`;
function banner(){const t=T[L].s;return `<div class="banner">${t.map((x,i)=>`<div class="slide ${i==sl?'on':''}" style="background:${bg[i]}"><b>${x[0]}</b><span>${x[1]}</span><div class="tr">${em[i]}</div></div>`).join('')}<div class="dots">${t.map((_,i)=>`<i class="${i==sl?'on':''}" onclick="sl=${i};draw()"></i>`).join('')}</div></div>`}
function navs(){return T[L].nav.map((n,i)=>`<a class="${i==act?'act':''}" tabindex="0" onclick="act=${i};draw()">${svg(keys[i])}${n}</a>`).join('')}
function draw(){const t=T[L];
document.getElementById('desk').innerHTML=`
<div class="top"><div class="logo"><div class="mark">S</div>Logo</div><div class="mid"><div class="brand">Sithumina Transport</div><div class="nums"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>+94 77 123 4567</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>+94 71 765 4321</span><span><svg viewBox="0 0 24 24" fill="#128C4A"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 .9-2.300c.3-.3.600-.3.800-.3h.600c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .600l-.4.600c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2 1.100 1 2 1.300 2.300 1.400.3.100.4.100.6-.1l.8-1c.2-.3.400-.2.600-.1l1.900.9c.3.1.5.2.5.3.1.100.1.700-.1 1.300z"/></svg>+94 76 555 0123</span></div></div>
<div class="right"><button class="login">${L=='en'?'Login':'ඇතුල් වන්න'}</button><div class="lang"><button class="${L=='en'?'on':''}" onclick="L='en';draw()">EN</button><button class="${L=='si'?'on':''}" onclick="L='si';draw()">සිං</button></div></div></div>
<div class="body"><nav class="side">${navs()}<div class="soc"><span>f</span><span>W</span><span>in</span><span>…</span></div></nav>
<div class="main">${banner()}
<div class="cta"><p>${t.desc}</p><div class="btns"><button class="btn p">${t.b1}</button><button class="btn s">${t.b2}</button></div></div>
<div class="mapcard"><div class="mapw">${map}<div class="live"><i></i>${t.live}</div><button class="gps">${t.gps}</button></div>
<div class="list"><h4>${t.list}</h4>${[['WP LB-4521','Colombo – Kandy',0],['SP KE-8830','Galle',1],['NW PD-1207','Kurunegala',1],['NC AB-6642','Anuradhapura',0]].map(r=>`<div class="lr"><div><b>${r[0]}</b>${r[1]}</div><span class="st ${r[2]?'em':'go'}">${r[2]?t.em:t.go}</span></div>`).join('')}</div></div>
</div></div>`;
