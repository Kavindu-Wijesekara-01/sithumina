<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sithumina Transport – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --y: #FFC20E;
  --ink: #1F1E1B;
  --red: #B3121F;
  --input-bg: #FED857;
  --input-border: #E5AA0E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--y);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  position: relative;
  overflow: hidden;
  padding: 24px;
}
/* Organic decorative curves & dashed road */
.bg-blob-tr {
  position: absolute;
  top: -80px;
  right: -80px;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  background: rgba(235, 160, 0, 0.35);
  pointer-events: none;
}
.bg-blob-mr {
  position: absolute;
  top: 30%;
  right: -100px;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: rgba(235, 160, 0, 0.22);
  pointer-events: none;
}
.bg-road {
  position: absolute;
  bottom: -60px;
  left: -40px;
  right: -40px;
  height: 200px;
  border-top: 3px dashed rgba(185, 125, 0, 0.55);
  border-radius: 50% 50% 0 0;
  background: rgba(240, 165, 0, 0.22);
  pointer-events: none;
}
.card {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 1;
}
.logo {
  width: 160px;
  height: auto;
  max-height: 120px;
  object-fit: contain;
  margin-bottom: 16px;
}
h1 {
  font-size: 28px;
  font-weight: 900;
  color: var(--red);
  letter-spacing: -0.3px;
  margin-bottom: 8px;
  text-align: center;
}
.tag {
  background: rgba(230, 155, 0, 0.55);
  padding: 6px 20px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 34px;
}
form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.input-icon {
  position: absolute;
  left: 18px;
  font-size: 19px;
  pointer-events: none;
}
input {
  width: 100%;
  height: 60px;
  background: var(--input-bg);
  border: 1.5px solid var(--input-border);
  border-radius: 24px;
  padding: 0 20px 0 52px;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  outline: none;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
}
input::placeholder {
  color: #7D5E06;
}
input:focus-visible {
  border-color: var(--ink);
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}
.btn {
  height: 60px;
  background: var(--ink);
  color: var(--y);
  border: none;
  border-radius: 24px;
  font: inherit;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
  transition: transform 0.1s, opacity 0.2s;
}
.btn:hover {
  opacity: 0.95;
}
.btn:active {
  transform: scale(0.98);
}
.btn:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 2px;
}
.error {
  color: #fff;
  background: rgba(31, 30, 27, 0.85);
  font-size: 13px;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 12px;
  text-align: center;
  display: none;
}
.error.show { display: block; }
</style>
</head>
<body>
<div class="bg-blob-tr"></div>
<div class="bg-blob-mr"></div>
<div class="bg-road"></div>

<main class="card">
  <img src="../public/logo.png" alt="Sithumina Transport" class="logo">
  <h1>Sithumina Transport</h1>
  <div class="tag">Riders & Admin</div>

  <form id="loginForm" novalidate>
    <div class="input-wrap">
      <span class="input-icon" aria-hidden="true">🪪</span>
      <input type="text" id="loginId" placeholder="Enter your ID" aria-label="Enter your ID" autocomplete="username">
    </div>
    <div id="errMsg" class="error" role="alert">Please enter at least 3 characters</div>
    <button type="submit" class="btn" id="loginBtn">
      <span>Login</span>
      <span aria-hidden="true">➔</span>
    </button>
  </form>
</main>

<script>
const form = document.getElementById('loginForm');
const idInput = document.getElementById('loginId');
const err = document.getElementById('errMsg');
const btn = document.getElementById('loginBtn');

form.onsubmit = (e) => {
  e.preventDefault();
  const val = idInput.value.trim();
  if (val.length < 3) {
    err.classList.add('show');
    idInput.focus();
    return;
  }
  err.classList.remove('show');
  btn.innerHTML = 'Signing in...';
  btn.style.opacity = '0.7';
  setTimeout(() => {
    window.location.href = './sithumina-admin.html';
  }, 600);
};
</script>
</body>
</html>
