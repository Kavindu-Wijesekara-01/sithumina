<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sithumina Transport – Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC20E;--y2:#FFE08A;--y3:#FFF6D6;--ink:#26231B;--mut:#6F6A5A;--bg:#F4F2EA;--card:#fff;--line:#E7E2D0;--ok:#1E9E5A;--red:#B3121F;--okb:#DDF3E7;--rb:#FBE0E0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150F;--card:#241F16;--ink:#F6F1DF;--mut:#B2AB92;--line:#3B3727;--y3:#352E12;--okb:#173B28;--rb:#4A1D1D}}
:root[data-theme="dark"]{--bg:#17150F;--card:#241F16;--ink:#F6F1DF;--mut:#B2AB92;--line:#3B3727;--y3:#352E12;--okb:#173B28;--rb:#4A1D1D}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sb{background:#26231B;color:#F6F1DF;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.br{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}.br img{width:44px}.br b{color:#FFC20E;font-size:15px;line-height:1.15}.br small{display:block;color:#B2AB92;font-size:11px;font-weight:600}
.sb a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;color:#D9D3BD;cursor:pointer;border:0;background:none;font:inherit;font-weight:600;text-align:left}
.sb a:hover{background:#363227}.sb a.on{background:var(--y);color:#26231B}.sb a .n{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:999px;padding:1px 7px}
.sb svg,.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid #3B3727;font-size:12px}.av{width:34px;height:34px;border-radius:50%;background:var(--y);color:#26231B;display:grid;place-items:center;font-weight:800;flex:none}
.mn{min-width:0;display:flex;flex-direction:column}
.tp{height:68px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.tp h1{font-size:20px;font-weight:800}.tp .sp{flex:1}
.srch{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:0 12px;height:40px;width:260px;color:var(--mut)}.srch input{border:0;background:none;font:inherit;width:100%;color:var(--ink);outline:0}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ct{padding:22px 24px 40px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.card h3 a{font-size:12px;color:var(--mut);cursor:pointer;font-weight:700}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{display:flex;flex-direction:column;gap:6px}.kpi .l{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:8px}.kpi .ic{width:32px;height:32px;border-radius:10px;background:var(--y);color:#26231B;display:grid;place-items:center}.kpi .v{font-size:26px;font-weight:800}.kpi .d{font-size:12px;font-weight:700;color:var(--ok)}
.btn{border:0;font:inherit;font-weight:700;padding:10px 16px;border-radius:12px;cursor:pointer;background:var(--y);color:#26231B;display:inline-flex;align-items:center;gap:8px}
.btn.o{background:none;border:2px solid var(--y);color:var(--ink)}.btn.d{background:var(--rb);color:var(--red)}.btn.g{background:var(--okb);color:#12663A}.btn.sm{padding:6px 12px;font-size:12px;border-radius:9px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hd .sp{flex:1}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px}.tabs button{border:0;background:none;font:inherit;font-weight:700;font-size:13px;padding:7px 14px;border-radius:9px;cursor:pointer;color:var(--mut)}.tabs button.on{background:var(--y);color:#26231B}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mut);padding:8px 10px;font-weight:700}td{padding:12px 10px;border-top:1px solid var(--line)}
.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--y2);color:#5B4300;white-space:nowrap}.pill.ok{background:var(--okb);color:#12663A}.pill.r{background:var(--rb);color:var(--red)}
.who{display:flex;align-items:center;gap:10px}.who .av{width:32px;height:32px;font-size:12px}
.rq{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}.rq .rt{flex:1;min-width:200px}.rq b{display:block}.rq small{color:var(--mut)}
.stars{color:#E9A800;letter-spacing:1px}
.bar{height:8px;border-radius:6px;background:var(--bg);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--y)}
.mapw{position:relative;background:var(--y3);border-radius:14px;overflow:hidden;display:grid;place-items:center}.mapw svg{height:100%;width:auto;max-width:100%}
.ml{display:grid;grid-template-columns:1fr 300px;gap:14px;height:calc(100vh - 160px);min-height:480px}.ml .mapw{height:100%}
.pl{display:flex;flex-direction:column;gap:8px;overflow:auto}.lr{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card);font:inherit;color:var(--ink);text-align:left;width:100%}.lr.on{border-color:var(--y);background:var(--y3)}.lr small{display:block;color:var(--mut)}
.pin{fill:#26231B;stroke:#FFC20E;stroke-width:3}.pin.e{fill:#1E9E5A}.ring{fill:none;stroke:#26231B;stroke-width:2}
.pulse{fill:#FFC20E;opacity:.5;animation:pu 2s infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.dr{transition:none}}
.sc{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9}.sc.on{display:block}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);z-index:10;padding:22px;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;gap:14px;overflow:auto}.dr.on{transform:none}
.fl{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:12px}.fl input,.fl select{height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:14px}.fl input:focus,.fl select:focus{outline:0;border-color:var(--y)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,200%);background:#26231B;color:#FFC20E;padding:12px 18px;border-radius:12px;font-weight:700;z-index:12;transition:transform .3s}.toast.on{transform:translate(-50%,0)}
.chart{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px}.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--mut);font-weight:700}.chart i{width:100%;max-width:38px;border-radius:8px 8px 4px 4px;background:var(--y2)}.chart i.mx{background:var(--y)}
.rc{display:none}
@media (max-width:900px){.app{grid-template-columns:1fr}.sb{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}.br,.me{display:none}.sb a{white-space:nowrap}.g4{grid-template-columns:1fr 1fr}.g2,.g3,.ml{grid-template-columns:1fr}.ml{height:auto}.ml .mapw{height:420px}.srch{display:none}.tp,.ct{padding-left:14px;padding-right:14px}.card{overflow-x:auto}}
</style></head><body>

<div class="sc" id="sc"></div><aside class="dr" id="dr" aria-label="Form"></aside><div class="toast" id="ts" role="status"></div>

function nav(){document.getElementById('sb').innerHTML=`<div class="br"><img src="${LOGO}" alt=""><div><b>Sithumina Transport</b><small>Admin console</small></div></div>`+pages.map(p=>`<a class="${pg==p[0]?'on':''}" onclick="go('${p[0]}')" tabindex="0">${ic(p[2])}${p[1]}${p[0]=='req'&&pend()?`<span class="n">${pend()}</span>`:''}</a>`).join('')+`<div class="me"><div class="av">AD</div><div><b>Admin</b><br><span style="color:#B2AB92">Head office</span></div></div>`}
function go(p){pg=p;render()}
function toast(m){const t=document.getElementById('ts');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function req(r,i,full){return `<div class="rq"><div class="av">${ini(r.c)}</div><div class="rt"><b>${r.c}</b><small>${r.f} → ${r.t} · ${r.l} · ${r.v}</small></div>${r.s=='p'?`<button class="btn g sm" onclick="rq(${i},'a')">Approve</button><button class="btn d sm" onclick="rq(${i},'r')">Reject</button>`:pl(r.s=='a'?'Approved':'Rejected')}</div>`}
function rq(i,s){D.req[i].s=s;toast(s=='a'?'Request approved':'Request rejected');render()}
function rvList(l){return l.map(r=>`<div style="padding:12px 0;border-top:1px solid var(--line)"><div class="hd"><b>${r.n}</b><span class="stars">${'★'.repeat(r.r)+'☆'.repeat(5-r.r)}</span><span class="sp"></span><small style="color:var(--mut)">${r.d}</small></div><p style="margin-top:4px;color:var(--mut)">${r.x}</p></div>`).join('')}
function chart(){const d=RV[per],mx=Math.max(...d.map(x=>x[1]));return `<div class="chart">${d.map(x=>`<div>${x[1]?x[1]+'K':''}<i class="${x[1]==mx?'mx':''}" style="height:${x[1]/mx*150}px"></i>${x[0]}</div>`).join('')}</div>`}
const V={
dash:()=>`<div class="g4">${[['veh','Live lorries','24','+3 today'],['req','Pending requests',pend(),'Needs action'],['riders','Active riders',D.riders.filter(r=>r.s).length+20,'+2 this week'],['money','Revenue today','LKR 76K','+12% vs yesterday']].map(k=>`<div class="card kpi"><div class="l"><span class="ic">${ic(k[0])}</span>${k[1]}</div><div class="v">${k[2]}</div><div class="d">${k[3]}</div></div>`).join('')}</div>
<div class="g2"><div class="card"><h3>Revenue this week <a onclick="go('money')">View all</a></h3>${chart()}</div><div class="card"><h3>Live map <a onclick="go('map')">Open</a></h3><div class="mapw" style="height:230px">${mapS()}</div></div></div>
<div class="g2"><div class="card"><h3>Pending requests <a onclick="go('req')">View all</a></h3><div style="display:flex;flex-direction:column;gap:10px">${D.req.map((r,i)=>r.s=='p'?req(r,i):'').join('')||'<p>All caught up 🎉</p>'}</div></div><div class="card"><h3>Latest reviews <a onclick="go('rev')">View all</a></h3>${rvList(D.rv.slice(0,3))}</div></div>`,
riders:()=>`<div class="hd"><div><b style="font-size:16px">${D.riders.length} riders</b></div><div class="sp"></div><button class="btn" onclick="form('rider')">${ic('plus')}Add rider</button></div><div class="card"><table><tr><th>Rider</th><th>ID</th><th>Phone</th><th>Vehicle</th><th>Status</th></tr>${D.riders.map(r=>`<tr><td><div class="who"><div class="av">${ini(r.n)}</div><b>${r.n}</b></div></td><td>${r.id}</td><td>${r.ph}</td><td>${r.v||'—'}</td><td>${pl(r.s?'Active':'Offline')}</td></tr>`).join('')}</table></div>`,
veh:()=>`<div class="hd"><b style="font-size:16px">${D.veh.length} vehicles</b><div class="sp"></div><button class="btn" onclick="form('veh')">${ic('plus')}Add vehicle</button></div><div class="card"><table><tr><th>Plate</th><th>Type</th><th>Capacity</th><th>Rider</th><th>Status</th></tr>${D.veh.map(v=>`<tr><td><b>${v.p}</b></td><td>${v.t}</td><td>${v.c}</td><td>${v.o}</td><td>${pl(v.s)}</td></tr>`).join('')}</table></div>`,
req:()=>{const m={p:'Pending',a:'Approved',r:'Rejected'};return `<div class="hd"><div class="tabs">${['p','a','r'].map(k=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${m[k]} (${D.req.filter(r=>r.s==k).length})</button>`).join('')}</div></div><div style="display:flex;flex-direction:column;gap:10px">${D.req.map((r,i)=>r.s==tab?req(r,i):'').join('')||'<div class="card">Nothing here.</div>'}</div>`},
rev:()=>{const l=D.rv.filter(r=>!star||r.r==star),avg=(D.rv.reduce((a,r)=>a+r.r,0)/D.rv.length).toFixed(1);return `<div class="g3"><div class="card kpi"><div class="l">Average rating</div><div class="v">${avg} <span class="stars">★</span></div><div class="d">${D.rv.length} reviews</div></div><div class="card" style="grid-column:span 2">${[5,4,3,2,1].map(s=>{const c=D.rv.filter(r=>r.r==s).length;return `<div class="hd" style="margin:5px 0"><span style="width:28px">${s} ★</span><div class="bar"><i style="width:${c/D.rv.length*100}%"></i></div><span style="width:20px">${c}</span></div>`}).join('')}</div></div><div class="card"><div class="hd"><div class="tabs">${[0,5,4,3,2,1].map(s=>`<button class="${star==s?'on':''}" onclick="star=${s};render()">${s?s+' ★':'All'}</button>`).join('')}</div></div>${rvList(l)}</div>`},
money:()=>`<div class="hd"><div class="tabs">${[['w','Week'],['m','Month'],['y','Year']].map(k=>`<button class="${per==k[0]?'on':''}" onclick="per='${k[0]}';render()">${k[1]}</button>`).join('')}</div></div><div class="g4"><div class="card kpi"><div class="l">Total revenue</div><div class="v">${tot[per]}</div><div class="d">+8% vs last period</div></div><div class="card kpi"><div class="l">Completed trips</div><div class="v">${{w:'312',m:'1,280',y:'14,960'}[per]}</div></div><div class="card kpi"><div class="l">Avg per trip</div><div class="v">LKR 1,420</div></div><div class="card kpi"><div class="l">Commission</div><div class="v">${{w:'LKR 44K',m:'LKR 103K',y:'LKR 1.05M'}[per]}</div></div></div><div class="g2"><div class="card"><h3>Revenue (LKR thousands)</h3>${chart()}</div><div class="card"><h3>By vehicle type</h3>${[['Lorry 20ft',38],['Lorry 14ft',27],['Lorry 10ft',22],['Canter',13]].map(x=>`<div class="hd" style="margin:9px 0"><span style="width:90px">${x[0]}</span><div class="bar"><i style="width:${x[1]}%"></i></div><b>${x[1]}%</b></div>`).join('')}</div></div>`,
map:()=>`<div class="hd"><div class="tabs">${['all','Empty','On trip'].map(k=>`<button class="${mf==k?'on':''}" onclick="mf='${k}';render()">${k=='all'?'All':k}</button>`).join('')}</div><span class="pill ok">● Live · ${D.lo.length} lorries</span></div><div class="ml"><div class="mapw">${mapS()}</div><div class="card pl"><h3>Lorries</h3>${D.lo.filter(l=>mf=='all'||l.s==mf).map(l=>`<button class="lr ${sel==l.p?'on':''}" onclick="sel='${l.p}';render()"><span><b>${l.p}</b><small>${l.r}</small></span>${pl(l.s)}</button>`).join('')}</div></div>`};
function render(){nav();document.getElementById('ttl').textContent=pages.find(p=>p[0]==pg)[1];document.getElementById('ct').innerHTML=V[pg]()}
function form(t){const r=t=='rider',dr=document.getElementById('dr');dr.innerHTML=`<h2 style="font-size:18px">${r?'Add rider':'Add vehicle'}</h2><form id="fm" style="display:flex;flex-direction:column;gap:14px">${r?`<label class="fl">Full name<input name="a" required></label><label class="fl">Phone number<input name="b" inputmode="tel" required></label><label class="fl">NIC number<input name="c"></label><label class="fl">Assign vehicle<select name="d"><option value="">None</option>${D.veh.map(v=>`<option>${v.p}</option>`).join('')}</select></label>`:`<label class="fl">Plate number<input name="a" placeholder="WP AB-1234" required></label><label class="fl">Vehicle type<select name="b"><option>Canter</option><option>Lorry 10ft</option><option>Lorry 14ft</option><option>Lorry 20ft</option></select></label><label class="fl">Capacity (tons)<input name="c" type="number" min="0.5" step="0.5" required></label><label class="fl">Rider<select name="d">${D.riders.map(v=>`<option>${v.n}</option>`).join('')}</select></label>`}<button class="btn" type="submit" style="justify-content:center;height:48px">Save</button><button class="btn o" type="button" onclick="cl()" style="justify-content:center">Cancel</button></form>`;
dr.classList.add('on');document.getElementById('sc').classList.add('on');dr.querySelector('input').focus();
document.getElementById('fm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(r)D.riders.push({n:f.get('a'),id:'R-'+(1001+D.riders.length),ph:f.get('b'),v:f.get('d'),s:1});else D.veh.push({p:f.get('a').toUpperCase(),t:f.get('b'),c:f.get('c')+' t',o:f.get('d'),s:'Empty'});cl();toast(r?'Rider added':'Vehicle added');render()}}
function cl(){document.getElementById('dr').classList.remove('on');document.getElementById('sc').classList.remove('on')}
document.getElementById('sc').onclick=cl;document.addEventListener('keydown',e=>{if(e.key=='Escape')cl()});
render();
</script></body></html>
